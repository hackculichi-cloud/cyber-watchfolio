name: Validate portfolio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  schedule:
    - cron: '15 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependency audit (block moderate and higher advisories)
        run: npm run security:audit
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Component tests
        run: npm run test
      - name: Install browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Production build and browser regression tests
        run: npm run test:e2e -- --workers=2
      - name: Public artifact check
        run: npm run security:artifacts
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
