name: Validate portfolio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Component tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Install browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser regression tests
        run: npm run test:e2e -- --workers=2
      - name: Dependency audit (block critical regressions)
        # Known CSS tooling advisories remain documented in docs/security-audit.md.
        # Print all findings; block new critical findings without hiding the others.
        run: npm audit --audit-level=critical
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
